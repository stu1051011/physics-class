<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>物理教學資源 | 等速率圓周運動</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background-color: #f8f9fa; }
        #sidebar { width: 250px; background-color: #343a40; color: white; padding: 20px; overflow-y: auto; }
        #sidebar h2 { font-size: 1.2rem; margin-bottom: 20px; color: #f8f9fa; border-bottom: 1px solid #4f5962; padding-bottom: 10px; }
        #sidebar ul { list-style-type: none; padding: 0; }
        #sidebar li { padding: 12px 10px; margin-bottom: 5px; border-radius: 5px; cursor: pointer; color: #ced4da; transition: 0.2s; }
        #sidebar li:hover, #sidebar li.active { color: #fff; background-color: #495057; }
        #content { flex-grow: 1; padding: 40px; overflow-y: auto; display: flex; flex-direction: column; align-items: center; }
        .card { background: white; padding: 40px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); max-width: 800px; width: 100%; }
        h1 { color: #212529; margin-top: 0; }
        p { line-height: 1.7; color: #495057; font-size: 1.1rem; }
        .controls { margin-top: 25px; padding: 20px; background: #e9ecef; border-radius: 8px; display: flex; align-items: center; gap: 15px; font-weight: bold; }
        input[type=range] { flex-grow: 1; cursor: pointer; }
        .canvas-container { display: flex; flex-direction: column; align-items: center; margin-top: 30px; }
        canvas { border: 1px solid #ced4da; border-radius: 8px; background: #ffffff; box-shadow: inset 0 0 10px rgba(0,0,0,0.02); }
        .legend { display: flex; gap: 30px; margin-top: 15px; font-weight: bold; font-size: 1.1rem; }
        .legend-v { color: #dc3545; }
        .legend-a { color: #0d6efd; }
    </style>
</head>
<body>

<div id="sidebar">
    <h2>物理實驗選單</h2>
    <ul>
        <li>直線運動</li>
        <li>拋體運動</li>
        <li class="active">等速率圓周運動</li>
        <li>微波光學實驗</li>
    </ul>
</div>

<div id="content">
    <div class="card">
        <h1>等速率圓周運動 (Uniform Circular Motion)</h1>
        <p>當質點在圓周上以固定速率運動時，稱為等速率圓周運動。由於運動方向不斷改變，這是一個具有加速度的運動。其加速度方向始終指向圓心，稱為<strong>向心加速度</strong>。</p>
        
        <div class="controls">
            <label for="omegaSlider">角速度 (ω) : <span id="omegaValue" style="color:#0d6efd;">1.0</span> rad/s</label>
            <input type="range" id="omegaSlider" min="0.5" max="2.5" step="0.1" value="1.0">
        </div>

        <div class="canvas-container">
            <canvas id="simCanvas" width="500" height="400"></canvas>
            <div class="legend">
                <span class="legend-v">→ 切線速度 (v)</span>
                <span class="legend-a">→ 向心加速度 (a)</span>
            </div>
        </div>
    </div>
</div>

<script>
    const canvas = document.getElementById('simCanvas');
    const ctx = canvas.getContext('2d');
    const omegaSlider = document.getElementById('omegaSlider');
    const omegaValueDisplay = document.getElementById('omegaValue');

    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const radius = 120; 
    let angle = 0;
    
    function drawArrow(fromx, fromy, tox, toy, color, width) {
        const headlen = 12; 
        const dx = tox - fromx;
        const dy = toy - fromy;
        const arrowAngle = Math.atan2(dy, dx);
        ctx.beginPath();
        ctx.moveTo(fromx, fromy);
        ctx.lineTo(tox, toy);
        ctx.lineTo(tox - headlen * Math.cos(arrowAngle - Math.PI / 6), toy - headlen * Math.sin(arrowAngle - Math.PI / 6));
        ctx.moveTo(tox, toy);
        ctx.lineTo(tox - headlen * Math.cos(arrowAngle + Math.PI / 6), toy - headlen * Math.sin(arrowAngle + Math.PI / 6));
        ctx.strokeStyle = color;
        ctx.lineWidth = width;
        ctx.stroke();
    }

    function animate() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        
        const omega = parseFloat(omegaSlider.value);
        omegaValueDisplay.innerText = omega.toFixed(1);

        // 繪製虛線軌道
        ctx.beginPath();
        ctx.arc(centerX, centerY, radius, 0, 2 * Math.PI);
        ctx.strokeStyle = '#adb5bd';
        ctx.lineWidth = 2;
        ctx.setLineDash([5, 5]);
        ctx.stroke();
        ctx.setLineDash([]);

        // 計算質點座標
        const x = centerX + radius * Math.cos(angle);
        const y = centerY + radius * Math.sin(angle);

        // 計算切線速度向量 (v = rω)
        const vScale = 30; 
        const vx = -Math.sin(angle) * omega * vScale;
        const vy = Math.cos(angle) * omega * vScale;

        // 計算向心加速度向量 (a = rω²)
        const aScale = 20;
        const ax = -Math.cos(angle) * omega * omega * aScale;
        const ay = -Math.sin(angle) * omega * omega * aScale;

        // 繪製向量
        drawArrow(x, y, x + vx, y + vy, '#dc3545', 3); // 紅色速度
        drawArrow(x, y, x + ax, y + ay, '#0d6efd', 4); // 藍色加速度

        // 繪製質點
        ctx.beginPath();
        ctx.arc(x, y, 12, 0, 2 * Math.PI);
        ctx.fillStyle = '#212529';
        ctx.fill();
        
        // 繪製圓心
        ctx.beginPath();
        ctx.arc(centerX, centerY, 5, 0, 2 * Math.PI);
        ctx.fillStyle = '#000';
        ctx.fill();

        angle += omega * 0.02;
        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
